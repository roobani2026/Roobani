<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Roobani">
  <!--
    Roobani favicon / square mark. Same R + gold growth tick concept,
    optimised for tiny rendering (16, 32, 64 px). Kept inside a 64x64
    safe area with deliberate negative space so the mark still reads
    at favicon scale.
  -->
  <title>Roobani</title>
  <rect width="64" height="64" fill="#1A1F3D"/>
  <g fill="none">
    <path d="M 16 50 L 44 50 L 50 44" stroke="#C9A84C" stroke-width="3" stroke-linecap="square"/>
    <g fill="#FAFAF8">
      <rect x="16" y="14" width="6" height="30"/>
      <path d="M 22 14 L 38 14 Q 46 14 46 22 Q 46 30 38 30 L 22 30 Z"/>
      <path d="M 34 30 L 46 44 L 38 44 L 26 32 Z"/>
    </g>
  </g>
</svg>
