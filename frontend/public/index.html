<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A1F3D" />

    <!-- Brand identity -->
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="apple-touch-icon" href="/brand/icon.svg" />
    <link rel="mask-icon" href="/brand/icon.svg" color="#1A1F3D" />

    <!-- Default SEO. Per-page meta + Open Graph + Twitter + canonical are
         injected by react-helmet-async via the <SEO/> component on each
         page (see src/components/SEO.jsx). A bare static fallback is left
         here for non-JS crawlers (e.g. old Slack previews) only. -->
    <title>Roobani — Concierge wealth, audited returns.</title>
    <meta name="description" content="Roobani pairs you with a dedicated portfolio manager and curated multi-asset plans across equities, sukuk-style fixed income, real assets, and digital assets. Licensed wealth management out of Nairobi." data-rh-default />

    <!-- Robots: allow indexing by default; specific routes override via Helmet. -->
    <meta name="robots" content="index,follow" />

    <!-- Typography. Preconnect to Google Fonts so we don't pay the DNS+TLS
         tax on the first paint. Then load the actual webfont CSS async-ish
         (display=swap keeps the page legible during font fetch). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- JSON-LD: Organization. Per-page LD-JSON (e.g. Service, BreadcrumbList)
         ships from individual pages via the SEO helper. This anchors entity
         identity for Google's knowledge graph. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialService",
      "name": "Roobani",
      "url": "https://roobani.com/",
      "logo": "https://roobani.com/brand/logo.svg",
      "description": "Private investment platform pairing clients with a dedicated portfolio manager and curated multi-asset plans across equities, fixed income, real assets, and digital assets.",
      "areaServed": ["KE", "AE", "GB", "US"],
      "founder": {"@type": "Organization", "name": "Roobani"},
      "foundingDate": "2018",
      "sameAs": [],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressCountry": "KE"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hello@roobani.com",
        "areaServed": "Worldwide",
        "availableLanguage": ["English"]
      }
    }
    </script>

    <script>
      // Pre-paint theme application to avoid FOUC (flash of unstyled / wrong theme).
      // Mirrors the logic in src/lib/theme.jsx.
      (function () {
        try {
          var stored = localStorage.getItem("rb-theme");
          var prefDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : (prefDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Roobani.</noscript>
    <div id="root"></div>
  </body>
</html>
